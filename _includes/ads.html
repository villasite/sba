<div class="container border-top my-5 bg-light py-5">
    <div class="row">
        <div class="col-12 text-center">
			<h2 class="section-heading">Additional Resources</h2>
       		<hr class="mx-auto">
		    <p class="text-center text-muted"><i>When clicked you may be redirected to another website</i></p>
		</div>
    </div>

	{% assign data = site.data.ads | sort: 'date' %}

    <div class="row" data-masonry='{"percentPosition": true }'>
		<div class="col-lg-4 col-sm-12">
			<div class="my-2 px-2 py-4 bg-white">
				<h3 class="fs-5 text-center text-uppercase">August Event</h3>
				<img class="img-fluid bg-dark mx-auto d-block" src="{{site.baseurl}}/img/birthday-club-august2023.jpeg" alt="Birthday Club event flyer">
			</div>
		</div>

	{% for entry in data %}
		<div class="col-lg-4 col-sm-12">
			<div class="my-2 px-2 py-4 bg-white">
				<a href="{{ entry.link }}" class="text-decoration-none" target="_blank">
				<h3 class="fs-5 text-center text-uppercase">{{ entry.title }}</h3>
					{% if entry.subtitle != null %}
						<p class="fs-6 text-center">{{ entry.subtitle }}</p>
					{% endif %}
				<img class="img-fluid bg-dark mx-auto d-block" src="{{ entry.img }}" alt="{{ entry.img-alt }}">
				</a>
			</div>
		</div>
	{% endfor %}
	</div>
</div>
