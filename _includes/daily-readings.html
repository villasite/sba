<div class="container my-4">
    <div class="row">
        <div class="col text-center">
            <h2>This Week's Lectionary Readings</h2>
            <hr class="mx-auto">
        </div>
    </div>

	{% assign data = site.data.usccb | sort: 'date' %}
	
	<div class="row text-center">
	{% for entry in data %}
		<div class="col-lg-3 col-sm-12 p-1">
			<div class="border px-2 py-4 bg-light">
				<a href="{{ entry.link }}" class="text-decoration-none" target="_blank">
				  <h3 class="fs-5">{{ entry.title }}</h3>
				</a>
				  <p class="fw-semibold">{{ entry.date | date: '%B %-d, %Y' }}</p> 
				  <p>{{ entry.readings }}</p>
			</div>
		</div>
	{% endfor %}
	</div>
</div>
